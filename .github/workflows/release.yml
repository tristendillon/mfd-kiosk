name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      # The repart image builder fakes root inside the Nix sandbox with
      # `unshare --map-root-user`. Ubuntu 24.04 runners block unprivileged user
      # namespaces via AppArmor, which fails that nested unshare
      # ("write failed /proc/self/uid_map: Operation not permitted").
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build ISO
        run: nix build ./os#iso -L

      # Raw GPT USB image (FAT32 ESP + ext4 root) for UEFI firmware that
      # refuses the isohybrid ISO layout (e.g. MeLE PCG02). Shares the kiosk
      # image build with the ISO, so the extra cost is just the flasher rootfs.
      - name: Build USB image
        run: nix build ./os#usbImage -L -o result-usb

      # Diagnostic flashers (un-quiet boot + passwordless technician autologin
      # on tty1) for board bring-up. Built ONLY on a manual workflow_dispatch
      # and uploaded as a short-retention artifact — never attached to a public
      # tagged release, since anyone with physical access to them gets a
      # root-capable shell with no token and no password.
      - name: Build debug ISO
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: nix build ./os#isoDebug -L -o result-debug

      - name: Build debug USB image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: nix build ./os#usbImageDebug -L -o result-usb-debug

      - name: Prepare release assets
        run: |
          mkdir release
          iso="$(echo result/iso/*.iso)"
          split -b 1900M -d -a 1 "$iso" release/mfd-kiosk-flasher.iso.part
          ( cd release && sha256sum mfd-kiosk-flasher.iso.part* > SHA256SUMS )
          sha256sum "$iso" | awk '{print $1 "  mfd-kiosk-flasher.iso"}' >> release/SHA256SUMS
          # The USB image is built zstd-compressed; publish it as a plain .img
          # (Etcher can't open .zst, Rufus support for it is spotty). Stream
          # the decompression straight into split parts so the whole multi-GB
          # image is never materialized on the runner's disk.
          img="$(echo result-usb/*.raw.zst)"
          zstd -dc "$img" | split -b 1900M -d -a 1 - release/mfd-kiosk-flasher-usb.img.part
          ( cd release && sha256sum mfd-kiosk-flasher-usb.img.part* >> SHA256SUMS )
          cat release/mfd-kiosk-flasher-usb.img.part* \
            | sha256sum | awk '{print $1 "  mfd-kiosk-flasher-usb.img"}' >> release/SHA256SUMS

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(cat <<'EOF'
          ## Which file do I want?

          - **`mfd-kiosk-flasher-usb.img`** — recommended for physical hardware. A real GPT disk
            image (FAT32 EFI System Partition + root); write it byte-for-byte with Rufus (DD mode),
            balenaEtcher, or `dd`. Some UEFI firmwares (e.g. the MeLE PCG02's Aptio) refuse the
            isohybrid ISO layout — this image is what they boot.
          - **`mfd-kiosk-flasher.iso`** — for VMs (attach as a CD) and optical media.

          ## Reassembling the images

          Both artifacts are split into parts because GitHub limits each release asset to 2 GiB.
          Download every part of the artifact you want plus `SHA256SUMS`, then reassemble:

          - Linux/macOS: `cat mfd-kiosk-flasher.iso.part* > mfd-kiosk-flasher.iso`
          - Windows: `copy /b mfd-kiosk-flasher.iso.part0+mfd-kiosk-flasher.iso.part1 mfd-kiosk-flasher.iso`

          Same pattern for the USB image:

          - Linux/macOS: `cat mfd-kiosk-flasher-usb.img.part* > mfd-kiosk-flasher-usb.img`
          - Windows: `copy /b mfd-kiosk-flasher-usb.img.part0+mfd-kiosk-flasher-usb.img.part1 mfd-kiosk-flasher-usb.img`

          Verify the downloads and the reassembled images:

          - `sha256sum -c SHA256SUMS`
          EOF
          )"
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "${notes}"

      - name: Upload artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: mfd-kiosk-flasher
          path: release/
          retention-days: 7
          compression-level: 0

      # The debug flashers go ONLY to a workflow_dispatch artifact — no release
      # asset, no 2 GiB split needed (artifacts allow large files). Grab them
      # from the run's Artifacts, flash, and diagnose; see docs/building.md.
      - name: Prepare debug asset
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir release-debug
          iso="$(echo result-debug/iso/*.iso)"
          cp -L "$iso" release-debug/mfd-kiosk-flasher-debug.iso
          img="$(echo result-usb-debug/*.raw.zst)"
          zstd -dc "$img" > release-debug/mfd-kiosk-flasher-usb-debug.img
          ( cd release-debug && sha256sum mfd-kiosk-flasher-debug.iso mfd-kiosk-flasher-usb-debug.img > SHA256SUMS )

      - name: Upload debug artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: mfd-kiosk-flasher-debug
          path: release-debug/
          retention-days: 7
          compression-level: 0
